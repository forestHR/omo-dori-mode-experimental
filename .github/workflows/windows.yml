name: windows

on:
  push:
    branches: [main, feat/herdr-windows]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-subset:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: skills/dori-mode/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # These files exercise native Windows or platform-neutral behavior.
      # POSIX launch worlds, ps/stat fixtures, /tmp paths, shell installers,
      # systemd, and bash guards remain in the full Linux suite.
      - name: Native Windows subset
        run: |
          bun test `
            ./test/herdr-backend.test.ts `
            ./test/herdr-revive.test.ts `
            ../setups/herdr-web/proxy.test.ts `
            ../setups/herdr-web/state.test.ts `
            ./test/windows-process.test.ts `
            ./test/windows-freeze.test.ts `
            ./test/windows-install.test.ts `
            ./test/serve.test.ts `
            ./test/report-shape.test.ts `
            ./test/discord-cards.test.ts
          exit $LASTEXITCODE

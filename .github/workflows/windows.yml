# Manual Windows validation; automatic PR checks block this fork's review/merge gate.
# Run by hand: gh workflow run windows.yml -R orientpine/omo-dori-mode-experimental --ref <branch>
name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-subset:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: skills/dori-mode/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # These files exercise native Windows or platform-neutral behavior.
      # POSIX launch worlds, ps/stat fixtures, /tmp paths, shell installers,
      # systemd, and bash guards remain in the full Linux suite.
      - name: Native Windows subset
        run: |
          $output = bun test --test-name-pattern "review 1" ./test/serve.test.ts ./test/windows-review.test.ts ./test/windows-install.test.ts 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { "$_" }
          if ($code -ne 1 -or -not ($output -match '^\s*10 fail')) {
            throw "Expected all ten regression cases to reject the pre-review implementation"
          }
          exit 0
